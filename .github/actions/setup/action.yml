name: Set up pnpm project
description: >-
  Installs the repository's pnpm (from packageManager in package.json) and Node.js versions,
  then installs dependencies from the lockfile.

inputs:
  node-version-file:
    description: File with the Node.js version, such as .nvmrc or package.json (engines.node).
    default: package.json

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
