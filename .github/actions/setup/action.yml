name: Set up pnpm project
description: Installs pnpm and Node.js with the versions both Mira repositories use, then installs dependencies from the lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.18.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
